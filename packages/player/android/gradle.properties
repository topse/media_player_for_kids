org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Built-in Kotlin (AGP 9): the app no longer applies KGP and all plugins in
# use are migrated (Flutter's build prints no KGP warning).
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Plugin sources live in the pub cache on C:, the build dir on U:. Kotlin's
# incremental compiler cannot relativize paths across drives and (since KGP
# 2.4) fails with "Could not close incremental caches".
kotlin.incremental=false
